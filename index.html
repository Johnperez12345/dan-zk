<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Panel - dan-zk</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background:linear-gradient(135deg, #1a1a2e, #16213e); min-height:100vh; color:white; }
        .container { max-width:500px; margin:0 auto; padding:40px 20px; }
        h1 { text-align:center; font-size:28px; margin-bottom:8px; color:#00d4ff; }
        .subtitle { text-align:center; color:#aaa; margin-bottom:30px; }
        
        .card {
            background:rgba(255,255,255,0.08); padding:25px; border-radius:16px;
            border:1px solid rgba(255,255,255,0.1); margin-bottom:20px;
        }
        .card h2 { font-size:18px; margin-bottom:15px; color:#00d4ff; }
        
        label { display:block; margin:12px 0 5px; font-size:14px; color:#ddd; }
        input, select {
            width:100%; padding:12px 15px; border:1px solid #333;
            border-radius:8px; font-size:15px; background:rgba(0,0,0,0.3);
            color:white;
        }
        input:focus, select:focus { outline:none; border-color:#00d4ff; }
        
        .btn {
            width:100%; padding:12px; background:linear-gradient(90deg, #00d4ff, #0088ff);
            color:white; border:none; border-radius:8px; font-size:16px;
            font-weight:bold; cursor:pointer; margin-top:10px;
        }
        .btn:hover { opacity:0.9; }
        .btn-green { background:linear-gradient(90deg, #00c853, #009624); margin-bottom:15px; }
        
        .result { margin-top:15px; padding:12px; border-radius:8px; display:none; word-break:break-all; }
        .result.success { background:rgba(0,200,100,0.2); color:#00ff88; display:block; }
        .result.error { background:rgba(255,50,50,0.2); color:#ff6666; display:block; }
        
        .api-box {
            background:rgba(0,0,0,0.4); padding:12px; border-radius:8px;
            font-family:monospace; font-size:13px; color:#00ff88;
            word-break:break-all; margin-top:10px;
        }
        .divider { text-align:center; margin:20px 0; color:#666; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 LICENSE PANEL</h1>
    <p class="subtitle">dan-zk.vercel.app</p>

    <!-- ✅ GENERATE KEY SECTION -->
    <div class="card">
        <h2>➕ Generate New Key</h2>
        <label>Game</label>
        <select id="genGame">
            <option value="PUBG" selected>PUBG</option>
            <option value="CODM">CODM</option>
            <option value="FREEFIRE">Free Fire</option>
        </select>
        <label>Validity (Days)</label>
        <input type="number" id="genDays" value="30" min="1" max="365">
        <button class="btn btn-green" onclick="generateKey()">✨ GENERATE KEY</button>
        <div class="result" id="genResult"></div>
    </div>

    <div class="divider">—————— OR ——————</div>

    <!-- ✅ VERIFY KEY SECTION -->
    <div class="card">
        <h2>✅ Verify License Key</h2>
        <label>License Key</label>
        <input type="text" id="licKey" placeholder="Ilagay ang License Key...">
        <label>Game</label>
        <input type="text" id="game" value="PUBG">
        <label>Device Serial</label>
        <input type="text" id="serial" value="device-001">
        <button class="btn" onclick="checkKey()">🔍 VERIFY KEY</button>
        <div class="result" id="resBox"></div>
    </div>

    <!-- ✅ API INFO -->
    <div class="card">
        <h2>📡 API Endpoint</h2>
        <p style="color:#aaa; font-size:14px; margin-bottom:8px;">Gamitin ito sa Injector mo:</p>
        <div class="api-box">https://dan-zk.vercel.app/api/verify</div>
    </div>
</div>

<script>
const API_URL = "https://dan-zk.vercel.app/api/verify";

// ✅ GENERATE NEW KEY
async function generateKey() {
    const game = document.getElementById("genGame").value;
    const days = document.getElementById("genDays").value;
    const resBox = document.getElementById("genResult");

    try {
        const url = API_URL + "?action=generate&game=" + encodeURIComponent(game) + "&days=" + days;
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "GENERATED") {
            showRes("✅ BAGONG KEY NABUO NA!\n\n🔑 KEY: " + data.key + "\n🎮 Game: " + data.game + "\n\n📋 KOPYAHIN MO ITO!", "success", "genResult");
        } else {
            showRes("❌ ERROR: " + data.message, "error", "genResult");
        }
    } catch (e) {
        showRes("❌ HINDI MAKAGENERATE!\n\n" + e, "error", "genResult");
    }
}

// ✅ VERIFY KEY
async function checkKey() {
    const key = document.getElementById("licKey").value.trim();
    const game = document.getElementById("game").value.trim();
    const serial = document.getElementById("serial").value.trim();

    if (!key) {
        showRes("❌ Ilagay muna ang License Key!", "error", "resBox");
        return;
    }

    try {
        const url = API_URL + "?game=" + encodeURIComponent(game) + "&user_key=" + encodeURIComponent(key) + "&serial=" + encodeURIComponent(serial);
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === "VALID") {
            showRes("✅ LICENSE VALID!\n\n🔑 Key: " + key + "\n📱 Device: " + serial, "success", "resBox");
        } else {
            showRes("❌ " + (data.message || "INVALID KEY"), "error", "resBox");
        }
    } catch (e) {
        showRes("❌ WALANG KONEKTA SA SERVER!\n\n" + e, "error", "resBox");
    }
}

function showRes(msg, type, boxId) {
    const box = document.getElementById(boxId);
    box.className = "result " + type;
    box.textContent = msg;
}
</script>

</body>
</html>
