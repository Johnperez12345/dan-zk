<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Panel - dan-zk</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
        body { background:linear-gradient(135deg, #0f172a, #1e293b); min-height:100vh; color:white; padding:20px; }
        .container { max-width:650px; margin:0 auto; }
        h1 { text-align:center; font-size:26px; margin-bottom:6px; color:#38bdf8; }
        .subtitle { text-align:center; color:#94a3b8; margin-bottom:25px; }
        .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .tab { padding:10px 16px; background:rgba(30,41,59,0.8); border-radius:8px; cursor:pointer; border:1px solid transparent; }
        .tab.active { background:#0ea5e9; border-color:#38bdf8; }
        .card { background:rgba(30,41,59,0.8); padding:20px; border-radius:12px; border:1px solid rgba(56,189,248,0.2); margin-bottom:15px; }
        .card h2 { font-size:16px; margin-bottom:12px; color:#38bdf8; }
        label { display:block; margin:10px 0 4px; font-size:14px; color:#cbd5e1; }
        input, select { width:100%; padding:10px; border:1px solid #334155; border-radius:6px; background:rgba(15,23,42,0.6); color:white; }
        .btn { padding:10px 18px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin:5px 5px 5px 0; }
        .btn-green { background:#10b981; color:white; }
        .btn-blue { background:#0ea5e9; color:white; }
        .btn-red { background:#ef4444; color:white; }
        .btn-gray { background:#475569; color:white; }
        .result { margin-top:10px; padding:10px; border-radius:6px; display:none; white-space:pre-wrap; font-size:13px; }
        .result.success { background:rgba(16,185,129,0.15); color:#34d399; display:block; }
        .result.error { background:rgba(239,68,68,0.15); color:#f87171; display:block; }
        .key-item { display:flex; justify-content:space-between; align-items:center; padding:10px; background:rgba(15,23,42,0.6); border-radius:6px; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
        .key-info { flex:1; min-width:200px; }
        .key-actions { display:flex; gap:5px; flex-wrap:wrap; }
        .status-on { color:#34d399; font-weight:bold; }
        .status-off { color:#f87171; font-weight:bold; }
        .hidden-section { display:none; }
        .copy-btn { font-size:12px; padding:4px 8px; margin-left:8px; }
        .loading { color:#facc15; display:none; margin-top:8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 LICENSE PANEL</h1>
    <p class="subtitle">dan-zk.vercel.app — Admin Only</p>

    <!-- LOGIN -->
    <div id="loginCard" class="card">
        <h2>🔑 Admin Login</h2>
        <label>Username</label>
        <input type="text" id="username" value="admin">
        <label>Password</label>
        <input type="password" id="password" placeholder="Ilagay ang Password...">
        <button class="btn btn-blue" onclick="adminLogin()">🔐 LOGIN</button>
        <div class="result" id="loginRes"></div>
    </div>

    <!-- MAIN PANEL -->
    <div id="mainPanel" class="hidden-section">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('generate')">➕ Generate Key</div>
            <div class="tab" onclick="switchTab('keys')">📋 Key Status</div>
            <div class="tab" onclick="switchTab('verify')">✅ Verify Key</div>
        </div>

        <!-- GENERATE KEY -->
        <div id="tab-generate">
            <div class="card">
                <h2>➕ Generate New License Key</h2>
                <label>Game</label>
                <select id="genGame">
                    <option value="CODM" selected>CODM</option>
                    <option value="PUBG">PUBG</option>
                </select>
                <button class="btn btn-green" onclick="generateKey()">✨ GENERATE KEY</button>
                <div class="loading" id="genLoad">⏳ Gumagawa ng Key...</div>
                <div class="result" id="genResult"></div>
            </div>
        </div>

        <!-- KEY STATUS -->
        <div id="tab-keys" class="hidden-section">
            <div class="card">
                <h2>📋 Key Management</h2>
                <button class="btn btn-blue" onclick="loadKeyList()">🔄 REFRESH LIST</button>
                <div class="loading" id="listLoad">⏳ Nilo-load...</div>
                <div id="keyList"></div>
            </div>
        </div>

        <!-- VERIFY -->
        <div id="tab-verify" class="hidden-section">
            <div class="card">
                <h2>✅ Verify License Key</h2>
                <label>License Key</label>
                <input type="text" id="licKey" placeholder="Ilagay ang License Key...">
                <button class="btn btn-blue" onclick="checkKey()">🔍 VERIFY KEY</button>
                <div class="result" id="resBox"></div>
            </div>
        </div>

        <div class="card">
            <h2>📡 API Endpoint</h2>
            <code style="background:rgba(15,23,42,0.8); padding:10px; border-radius:6px; color:#34d399; display:block; word-break:break-all; margin-top:8px;">https://dan-zk.vercel.app/api/verify</code>
        </div>
    </div>
</div>

<script>
const API_URL = "/api/verify";
const ADMIN_USER = "admin";
const ADMIN_PASS = "admin123";
let isLoggedIn = false;

function adminLogin() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === ADMIN_USER && p === ADMIN_PASS) {
        isLoggedIn = true;
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("mainPanel").style.display = "block";
    } else {
        alert("❌ MALI NA USERNAME O PASSWORD!");
    }
}

function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-generate').style.display = 'none';
    document.getElementById('tab-keys').style.display = 'none';
    document.getElementById('tab-verify').style.display = 'none';
    document.getElementById('tab-' + name).style.display = 'block';
    if (name === 'keys') loadKeyList();
}

// ✅ MAS MABILIS NA GENERATE — AGAD ANG RESPONSE!
async function generateKey() {
    const g = document.getElementById("genGame").value;
    document.getElementById("genLoad").style.display = "block";
    document.getElementById("genResult").style.display = "none";

    try {
        const res = await fetch(API_URL + "?action=generate&game=" + encodeURIComponent(g));
        const data = await res.json();
        document.getElementById("genLoad").style.display = "none";

        if (data.status === "GENERATED") {
            document.getElementById("genResult").className = "result success";
            document.getElementById("genResult").innerHTML = 
                "✅ BAGONG KEY NABUO NA!\n\n🔑 KEY: <strong>" + data.key + "</strong>\n\n" +
                "<button class='btn btn-green copy-btn' onclick='copyText(\"" + data.key + "\")'>📋 COPY KEY</button>";
        } else {
            document.getElementById("genResult").className = "result error";
            document.getElementById("genResult").textContent = "❌ ERROR: " + (data.message || "Hindi mabuo");
        }
    } catch (e) {
        document.getElementById("genLoad").style.display = "none";
        alert("❌ WALANG KONEKTA SA SERVER!");
    }
}

// ✅ AGAD NAGRE-REFRESH PAG-LOAD!
async function loadKeyList() {
    document.getElementById("listLoad").style.display = "block";
    document.getElementById("keyList").innerHTML = "";

    try {
        const res = await fetch(API_URL + "?action=list");
        const data = await res.json();
        document.getElementById("listLoad").style.display = "none";

        if (data.status !== "SUCCESS") {
            document.getElementById("keyList").innerHTML = "<p style='color:red;'>❌ ERROR: " + (data.message || "Hindi ma-load") + "</p>";
            return;
        }

        let html = "<p style='color:#94a3b8; margin:8px 0;'>📋 Total Keys: <strong>" + data.totalKeys + "</strong></p>";
        for (const [key, info] of Object.entries(data.keys)) {
            const statusClass = info.active ? "status-on" : "status-off";
            const statusText = info.active ? "✅ ACTIVE" : "❌ INACTIVE";
            html += `
            <div class="key-item">
                <div class="key-info">
                    <div><strong>${key}</strong> <button class="btn copy-btn" onclick="copyText('${key}')">📋 COPY</button></div>
                    <div style="font-size:12px; color:#94a3b8;">Game: ${info.game} | <span class="${statusClass}">${statusText}</span></div>
                </div>
                <div class="key-actions">
                    <button class="btn ${info.active?'btn-gray':'btn-green'}" onclick="toggleKey('${key}', ${!info.active})">${info.active?'🔴 OFF':'🟢 ON'}</button>
                    <button class="btn btn-red" onclick="deleteKey('${key}')">🗑️ DELETE</button>
                </div>
            </div>`;
        }
        document.getElementById("keyList").innerHTML = html;
    } catch (e) {
        document.getElementById("listLoad").style.display = "none";
        alert("❌ HINDI MA-LOAD ANG LISTAHAN!");
    }
}

// ✅ COPY FUNCTION
function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert("✅ NA-COPY NA!\n" + text);
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert("✅ NA-COPY NA!\n" + text);
    });
}

// ✅ I-ON/OFF — AGAD NAGRE-REFRESH!
async function toggleKey(key, newStatus) {
    try {
        await fetch(API_URL + "?action=set-status&user_key=" + encodeURIComponent(key) + "&status=" + (newStatus?"true":"false"));
        loadKeyList(); // ✅ AGAD NA-REFRESH!
    } catch (e) {
        alert("❌ HINDI MA-UPDATE!");
    }
}

// ✅ DELETE — AGAD NAWAWALA! AGAD NAGRE-REFRESH!
async function deleteKey(key) {
    if (!confirm("Sigurado ka bang I-DELETE?\n\n" + key)) return;
    try {
        await fetch(API_URL + "?action=delete&delete_key=" + encodeURIComponent(key));
        alert("✅ KEY NA-DELETE NA!");
        loadKeyList(); // ✅ AGAD NAWAWALA! AGAD NA-REFRESH ANG LISTAHAN!
    } catch (e) {
        alert("❌ HINDI MA-DELETE!");
    }
}

async function checkKey() {
    const k = document.getElementById("licKey").value.trim();
    if (!k) { alert("❌ Ilagay muna ang Key!"); return; }
    try {
        const res = await fetch(API_URL + "?user_key=" + encodeURIComponent(k) + "&game=CODM&serial=test");
        const data = await res.json();
        if (data.status === "VALID") {
            document.getElementById("resBox").className = "result success";
            document.getElementById("resBox").textContent = "✅ VALID!\n" + (data.message || "");
        } else {
            document.getElementById("resBox").className = "result error";
            document.getElementById("resBox").textContent = "❌ " + (data.message || "INVALID KEY");
        }
    } catch (e) {
        alert("❌ WALANG KONEKTA!");
    }
}
</script>
</body>
</html>
